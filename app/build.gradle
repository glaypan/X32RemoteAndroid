plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名密码从 keystore.properties 读取（该文件含敏感信息，已列入 .gitignore，不入库）。
// 克隆方需自备 x32release.jks 与 keystore.properties；缺失时 release 不签名并告警，
// 而不是把密码硬编码进会被提交的构建脚本。
def ksPropsFile = rootProject.file("keystore.properties")
def ksProps = new Properties()
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
} else {
    logger.warn('[X32Remote] 未找到 keystore.properties —— release 包将不签名（详见 README「签名说明」）')
}

android {
    namespace 'com.x32remote'
    compileSdk 35

    defaultConfig {
        applicationId "com.x32remote"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
    }

    signingConfigs {
        // 自用发布包：使用独立密钥库（有效期 30 年）。
        // 用独立 keystore 而非 debug 密钥，可保证后续版本升级覆盖安装时不冲突。
        if (ksPropsFile.exists()) {
            release {
                storeFile file("${rootDir}/x32release.jks")
                storePassword ksProps.getProperty("storePassword")
                keyAlias ksProps.getProperty("keyAlias")
                keyPassword ksProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.all {
            // 固定 UTF-8，避免源码含中文断言时在不同区域设置下出错
            it.jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    // JVM 单测下提供 org.json 实现（Android 运行时由系统提供）
    testImplementation 'org.json:json:20231013'
}
